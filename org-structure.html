<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-image: url(bg/quad-bg.png);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }
        
        header {
            background: url('images/ursm1.svg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        
        .lesson-content {
            margin-top: 10px;
            padding: 10px;
            padding-left: 35px;
            padding-right: 35px;
            border: 2px solid #004080;
            border-radius: 15px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.7rem;
            width: 100%;
            background:#064b90;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 0 60px rgba(30, 60, 180, 0.25),
                        0 8px 20px rgba(0, 0, 0, 0.2);
            border-radius: 0 0 12px 12px;
            margin-top: 3px;
            position: sticky;
            z-index: 999;
            top: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1.5rem;
            margin: 0 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        nav a:hover {
            background: #3498db;
            color: #fff;
            box-shadow: 0 0 10px rgba(30, 60, 180, 0.5);
        }
        main {
            padding: 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 2rem;
        }
        
        .hero {
            color: rgb(28, 12, 129);
            padding: 2rem 1rem;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: rgb(255, 255, 255);
        }
        
        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 2rem;
        }
        
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #3498db;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease; 
        }
        
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        
        .section {
            padding: 3rem 2rem;
            background-color: white;
        }

        .section:nth-child(even) {
            background-color: #eef2f7;
        }

        .section h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            border-left: 5px solid #003366;
            padding-left: 1rem;
            color: blue;
        }

        .section p {
            max-width: 800px;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            text-align: justify;
        }

        @media (max-width: 768px) {
            nav {
                flex-wrap: wrap;
            }
            
            nav a {
                padding: 0.5rem 1rem;
                margin: 0.2rem;
                font-size: 0.9rem;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero p {
                font-size: 1rem;
            }
        }
        .img{
            width: 1000px;
            height: 550px;
            border-radius: 10px;
        }
    </style>
 </head>
<body>
    <header>
        <div id="lessons" class="lesson-content">
            <h1>University of Rizal System - Morong Campus</h1>
            <p>Nurturing Tomorrow's Noblest</p>
        </div>
    </header>
    
    <nav>
        <a href="home.html">Home</a>
        <a href="home.html#about">About Us</a>
        <a href="administrators.html">Administrators</a>
        <a href="org-structure.html" class="active">Organizational Structure</a>
        <a href="departments.html">Departments</a>
        <a href="archives.html">Archives</a>
        <a href="contact.html">Contact Us</a>
    </nav>
    
    <main>
        <section class="hero">
            <h1>Organizational Structure</h1>
            <img src="D:\HTML\URSM WEBSITE\images\URSM Organizational Structure.png" class="img">
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 University of Rizal System. All rights reserved.</p>
    </footer>
</body>
</html>
