<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f9;
      color: #333;
      background-image: url(bg/quad-bg.png);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
    }

    header {
            background: url('images/ursm1.svg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        
        .lesson-content {
            margin-top: 10px;
            padding: 10px;
            padding-left: 35px;
            padding-right: 35px;
            border: 2px solid #004080;
            border-radius: 15px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
        }

    .lesson-content-dept {
    margin-top: 10px;
    width: 95%;                
    padding: 40px 80px;        
    border: 3px solid #004080; 
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.4); 
    font-size: 1.4rem;
    text-align: center;
    }

    nav {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0.7rem;
        width: 100%;
        background:#064b90;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 0 60px rgba(30, 60, 180, 0.25),
                    0 8px 20px rgba(0, 0, 0, 0.2);
        border-radius: 0 0 12px 12px;
        margin-top: 3px;
    position: sticky;
    z-index: 999;
    top: 0;
    }

    nav a {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1.5rem;
        margin: 0 0.5rem;
        font-weight: 600;
        transition: all 0.3s ease;
        border-radius: 6px;
    }

    nav a:hover {
        background: #3498db;
        color: #fff;
        box-shadow: 0 0 10px rgba(30, 60, 180, 0.5);
    }

    main {
        padding: 0;
        max-width: 1200px;
        margin: 0 auto;
    }
        
    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
      text-align: center;
    }

    h2 {
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }

    .info-links {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2rem;
    }

    .info-button {
      display: block;
      width: 90%;
      max-width: 500px;
      padding: 2rem;
      background: #dce9f9;
      color: #003366;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .info-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      background-color: #cfe4ff;
    }

    footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 2rem;
        }

    @media (max-width: 600px) {
      .info-button {
        font-size: 1rem;
        padding: 1.5rem;
      }
    }
  </style>
</head>
